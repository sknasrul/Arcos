<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VIP Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f2f2f7;--fg:#1c1c1e;--fg2:rgba(60,60,67,.74);--sub:rgba(60,60,67,.55);--tint:#007aff;--ai:#7a5cff;
--card:rgba(255,255,255,.74);--stroke:rgba(255,255,255,.85);--glass:rgba(255,255,255,.3);--pill:rgba(120,120,128,.18);--rim1:rgba(255,255,255,.95);--rim2:rgba(255,255,255,.55);--lensbg:rgba(255,255,255,.94);--shadow:rgba(40,40,70,.2);--dim:rgba(40,40,70,.22);
--a1:#9cc8ff;--a2:#f6d9a0;--a3:#c9b8ff;--ao:.55;
--spring:cubic-bezier(.32,1.25,.4,1);--soft:cubic-bezier(.32,.72,0,1);--out:cubic-bezier(.22,1,.36,1);--bounce:cubic-bezier(.34,1.56,.64,1);
--gs:'Google Sans','Product Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
[data-theme=dark]{color-scheme:dark;--bg:#000;--fg:#fff;--fg2:rgba(255,255,255,.72);--sub:rgba(235,235,245,.6);--tint:#0a84ff;--ai:#9b8cff;
--card:rgba(44,44,48,.55);--stroke:rgba(255,255,255,.1);--glass:rgba(44,44,48,.38);--pill:rgba(255,255,255,.14);--rim1:rgba(255,255,255,.5);--rim2:rgba(255,255,255,.2);--lensbg:rgba(76,76,82,.94);--shadow:rgba(0,0,0,.6);--dim:rgba(0,0,0,.5);
--a1:#0b4a9e;--a2:#7a5410;--a3:#4b2fa8;--ao:.42}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;background:var(--bg);color:var(--fg);font:15px/1.4 var(--ui);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--tint);outline-offset:3px;border-radius:14px}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;opacity:var(--ao);will-change:transform}
.aurora i:nth-child(1){width:660px;height:660px;left:-210px;top:-190px;background:radial-gradient(closest-side,var(--a1) 30%,transparent);animation:d1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:600px;height:600px;right:-190px;top:50px;background:radial-gradient(closest-side,var(--a2) 30%,transparent);animation:d2 32s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:660px;height:660px;left:calc(28% - 70px);top:490px;background:radial-gradient(closest-side,var(--a3) 30%,transparent);animation:d3 38s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(90px,70px) scale(1.12)}}@keyframes d2{to{transform:translate(-80px,90px) scale(1.08)}}@keyframes d3{to{transform:translate(-110px,-60px) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(10deg)}50%{transform:rotate(0)}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,89,.5)}70%,100%{box-shadow:0 0 0 7px rgba(52,199,89,0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sfade{0%{opacity:1}100%{opacity:.15}}
@keyframes pop{from{opacity:0;transform:scale(.55) translateY(10px)}to{opacity:1;transform:none}}

/* page */
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 30px) 20px 160px}
@media(min-width:720px){.wrap{padding:56px 40px 60px 120px}}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:28px}
.eyebrow{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--fg2);margin-bottom:10px}
.vip{font:700 11.5px var(--gs);letter-spacing:.05em;color:#3a2a05;background:linear-gradient(135deg,#F6D365,#D9A441);padding:3px 10px;border-radius:999px;box-shadow:0 4px 10px -3px rgba(217,164,65,.6),inset 0 1px 0 rgba(255,255,255,.5)}
h1{font:700 clamp(32px,6vw,52px)/1.05 var(--gs);letter-spacing:-.03em}h1 small{display:block;font:500 clamp(17px,3vw,22px)/1.3 var(--gs);letter-spacing:0;color:var(--fg2);margin-bottom:2px}
.wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.4s ease-in-out infinite}
.sub{margin-top:10px;font-size:14.5px;color:var(--fg2)}
.user{display:flex;align-items:center;gap:12px;flex-shrink:0}
.gb{position:relative;width:46px;height:46px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--fg);cursor:pointer;transition:transform .5s var(--bounce)}
.gb svg{position:relative;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.gb:active{transform:scale(.88)}
.av{position:relative;width:56px;height:56px;border-radius:50%;box-shadow:0 0 18px 2px rgba(246,211,101,.4)}
.av .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#CAA04D,#F6D365,#FFF3D1,#CAA04D);animation:spin 6s linear infinite}
.av b{position:absolute;inset:3px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:500 17px var(--gs);color:var(--fg)}
.av u{position:absolute;right:0;bottom:0;width:14px;height:14px;border-radius:50%;background:#34C759;border:2.5px solid var(--bg);animation:pulse 2.4s ease-out infinite}
.panel{display:none}.panel.on{display:block;animation:rise .6s var(--out) backwards}
#p-details,#p-ai{min-height:40vh}
.home{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:26px;align-items:start}
@media(max-width:899px){.home{grid-template-columns:1fr;gap:22px}.stage{max-width:430px}}
.sh{margin:0 4px 12px}.sh h2{font:700 22px var(--gs);letter-spacing:-.02em}.sh p{font-size:13.5px;color:var(--fg2);margin-top:2px}
.tiles{display:grid;gap:12px}
.card{position:relative;background:var(--card);border:1px solid var(--stroke);border-radius:28px;box-shadow:0 1px 1px rgba(0,0,0,.03),0 10px 26px -12px var(--shadow);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 var(--rim2)}
.tile{display:flex;align-items:center;gap:15px;padding:16px 18px;width:100%;text-align:left;cursor:pointer;color:var(--fg);transition:transform .5s var(--soft),box-shadow .5s var(--soft),opacity .3s}
.tile.hid{opacity:0}
@media(hover:hover){.tile:hover{transform:translateY(-3px);box-shadow:0 2px 2px rgba(0,0,0,.04),0 18px 36px -12px var(--shadow)}.tile:hover .go{transform:translateX(3px);color:var(--c)}}
.tile:active{transform:scale(.985)}
.ti{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex-shrink:0;color:#fff;background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 68%,#000));box-shadow:0 10px 18px -8px var(--c),inset 0 1px 0 rgba(255,255,255,.4)}
.ti svg{width:24px;height:24px;stroke-width:1.9}
/* iOS-style folder icon: a mini grid of the apps inside */
.ti.folder{grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;place-items:stretch;gap:3px;padding:5px;background:linear-gradient(145deg,rgba(120,120,128,.3),rgba(120,120,128,.16));box-shadow:0 10px 18px -10px var(--c),inset 0 1px 0 rgba(255,255,255,.5)}
.ti .mi{display:grid;place-items:center;border-radius:7px;background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 68%,#000))}
.ti .mi svg{width:11px;height:11px;stroke-width:2.2}
.tt{flex:1;min-width:0}.tt b{display:block;font:500 17px var(--gs);letter-spacing:-.01em}.tt span{font-size:12.5px;color:var(--fg2)}
.go{width:18px;height:18px;stroke-width:2.6;color:var(--sub);transition:transform .4s var(--soft),color .3s}

/* iOS-style folder overlay */
.fo{position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding:24px;visibility:hidden}
.fo.on{visibility:visible}
.fo-bd{position:absolute;inset:0;background:var(--dim);-webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%)}
.fo-card{width:min(100%,380px);padding:26px 18px 30px;border-radius:36px;transform-origin:0 0;text-align:center}
.fo-card:focus{outline:none}
.fo-card h3{font:700 22px var(--gs);letter-spacing:-.01em;margin-bottom:24px}
.fo-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:24px 14px}
.fi{width:104px;display:flex;flex-direction:column;align-items:center;gap:9px;font-size:12.5px;font-weight:600;line-height:1.25;transition:transform .35s var(--bounce)}
.fi:active{transform:scale(.92)}
.fic{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 68%,#000));box-shadow:0 12px 20px -9px var(--c),inset 0 1px 0 rgba(255,255,255,.4)}
.fic svg{width:34px;height:34px;stroke-width:1.8}
.fo.on .fi{animation:pop .55s var(--bounce) backwards;animation-delay:calc(var(--n,0)*55ms + 140ms)}
.fo.on h3{animation:fade .35s .15s backwards}
.fo.closing .fi,.fo.closing h3{opacity:0;animation:none;transition:opacity .15s}

/* VIP card */
.stage{perspective:1000px}
.vc{position:relative;width:100%;aspect-ratio:85.6/53.98;border-radius:24px;padding:24px 28px;color:#f5f1e6;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
background:radial-gradient(130% 110% at 100% 100%,rgba(201,140,60,.6) 0%,rgba(140,92,44,.22) 32%,transparent 60%),linear-gradient(160deg,#1b1c25 0%,#111119 45%,#0c0c11 100%);
border:1px solid rgba(246,211,101,.4);box-shadow:0 30px 50px -22px rgba(60,40,10,.55);transition:transform .35s var(--out);transform-style:preserve-3d;will-change:transform}
.vc::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(122deg,transparent 32%,rgba(255,255,255,.05) 42%,rgba(255,255,255,.17) 48%,rgba(255,255,255,.07) 54%,transparent 64%)}
.vc>*{position:relative}.vt{display:flex;align-items:center;justify-content:space-between}
.vb{display:flex;align-items:center;gap:7px;color:#F6D365;font-size:13px;font-weight:800;letter-spacing:.06em}.vb svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{width:48px;height:33px;border-radius:7px;background:linear-gradient(135deg,#c99a4e,#f4e2ad 45%,#e2c288 70%,#b8894a);box-shadow:0 3px 8px rgba(0,0,0,.4)}
.vg{font-size:10px;font-weight:700;letter-spacing:.12em;color:rgba(245,241,230,.45)}
.vn{margin-top:10px;font:500 clamp(19px,5.4vw,25px) var(--gs);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vd{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}.vd .full{grid-column:1/-1}
.vd small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.12em;color:rgba(245,241,230,.45);margin-bottom:3px}.vd b{font-size:14.5px;font-weight:700}

/* in-page preloader (sits under the nav bar so navigation stays visible) */
.loader{position:fixed;inset:0;z-index:7;display:grid;place-content:center;justify-items:center;gap:18px;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.loader.on{opacity:1;visibility:visible}
.loader p{font:500 15px var(--gs);color:var(--fg2)}
.sp{width:38px;height:38px;position:relative}
.sp i{position:absolute;inset:0;transform:rotate(calc(var(--n)*30deg));animation:sfade 1s linear infinite;animation-delay:calc(var(--n)*83.3ms - 1s)}
.sp i::before{content:"";display:block;margin:0 auto;width:3.5px;height:10px;border-radius:2px;background:var(--fg)}
.err{padding:26px 22px;text-align:center}
.err p{color:var(--fg2);margin:6px 0 16px;font-size:14px}
.sg{border:1px solid var(--stroke);background:var(--card);color:var(--tint);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;transition:transform .4s var(--bounce)}.sg:active{transform:scale(.94)}

/* navigation: glass tab bar + AI button (bottom on phones, vertical rail on desktop) */
.scrim{position:fixed;z-index:8;left:0;right:0;bottom:0;height:150px;opacity:.9;pointer-events:none;background:linear-gradient(transparent,var(--bg) 85%);-webkit-mask:linear-gradient(transparent,#000 60%);mask:linear-gradient(transparent,#000 60%)}
.dock{position:fixed;z-index:10;left:0;right:0;bottom:0;margin:0 auto;width:min(100%,400px);padding:0 21px calc(26px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
.dock>*{pointer-events:auto}
@media(min-width:720px){.dock{left:20px;right:auto;top:50%;bottom:auto;margin:0;width:64px;padding:0;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:12px;transform:translateY(-50%)}.scrim{display:none}}
.glass{position:absolute;inset:0;border-radius:999px;pointer-events:none;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(190%);backdrop-filter:blur(14px) saturate(190%);box-shadow:0 10px 30px var(--shadow),inset 0 1.5px 1px var(--rim1),inset 0 -1px 1px var(--rim2)}
.lite .glass{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(rgba(255,255,255,.28),transparent 50%)}
.tabbar{position:relative;height:64px;width:calc(100% - 76px);touch-action:none;user-select:none;-webkit-user-select:none;transition:width .6s var(--spring)}
@media(max-width:719px){.dock.min .tabbar{width:132px}.dock.min .item:not(.on){flex-grow:0;opacity:0;pointer-events:none}}
@media(min-width:720px){.tabbar{width:64px;height:128px;transition:none}}
.pill{--z:0;position:absolute;z-index:1;left:0;top:4px;height:56px;border-radius:28px;background:var(--pill);pointer-events:none;will-change:transform;transition:opacity .3s}
@media(min-width:720px){.pill{left:4px;top:0;width:56px;height:auto}}
.tabbar.dim .pill{opacity:0}
.clip{position:absolute;inset:0;border-radius:inherit;overflow:hidden}.pill.lens{z-index:3}
.pill::before,.pill::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:var(--z);pointer-events:none;will-change:opacity}
.pill::before{background:var(--lensbg);box-shadow:0 8px 24px rgba(0,0,0,.16)}
.pill::after{z-index:2;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),inset 0 3px 7px rgba(255,255,255,.65),inset 0 -4px 9px rgba(255,255,255,.3)}
.zoom{position:absolute;left:0;top:-4px;width:var(--tw,200px);height:var(--th,64px);opacity:var(--z);visibility:hidden;will-change:transform,opacity}.lens .zoom{visibility:visible}
@media(min-width:720px){.zoom{left:-4px;top:0}}
.items{position:absolute;z-index:2;inset:0;display:flex;padding:4px}
@media(min-width:720px){.items{flex-direction:column}}
.item{flex:1 1 0;min-width:0;min-height:0;overflow:hidden;white-space:nowrap;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 10px var(--ui);color:var(--fg2);transition:flex-grow .6s var(--spring),opacity .35s,color .25s}
.item.on,.item.hover{color:var(--tint)}
.tabbar.dim .item.on{color:var(--fg2)}
.item svg{width:26px;height:26px;fill:currentColor;fill-opacity:0;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transform-origin:50% 70%;transition:fill-opacity .3s}
.item.on svg{fill-opacity:.22}
.tabbar.dim .item.on svg{fill-opacity:0}
.label{max-height:14px}
.aibtn{position:relative;flex:none;width:64px;height:64px;border:0;background:none;border-radius:32px;color:var(--ai);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 10px var(--ui);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.aibtn:active{transform:scale(.92)}
.aibtn::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--pill);z-index:1;opacity:0;transform:scale(.7);transition:opacity .3s,transform .5s var(--spring);pointer-events:none}
.aibtn.on::before{opacity:1;transform:none}
.aibtn>svg,.aibtn>span{position:relative;z-index:2}
.aibtn>svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:currentColor;fill-opacity:0;transition:fill-opacity .3s}
.aibtn.on>svg{fill-opacity:.22}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}.aurora i{animation:none}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="wrap" id="wrap" style="visibility:hidden">
  <header class="top">
    <div>
      <div class="eyebrow"><span class="vip">VIP</span><span id="eb"></span></div>
      <h1 id="h1"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="user">
      <button class="gb out" id="out" type="button" aria-label="Log out"><div class="glass"></div><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></button>
      <div class="av" aria-hidden="true"><i class="ring"></i><b id="ini">--</b><u></u></div>
    </div>
  </header>

  <section class="panel on" id="p-home">
    <div class="home">
      <div class="stage"><div class="vc" id="vc">
        <div class="vt"><div class="vb"><svg viewBox="0 0 24 24"><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7Z"/><path d="M5 20h14"/></svg>VIP ACCESS</div><div class="chip"></div></div>
        <div><div class="vg">PREMIUM ACCESS GRANTED</div><div class="vn" id="vn">—</div></div>
        <div class="vd"><div><small>ARCOS ID</small><b id="vi">—</b></div><div><small>TYPE</small><b id="vy">Platinum</b></div><div class="full"><small>STATUS</small><b id="vs">Active</b></div></div>
      </div></div>
      <div><div class="sh"><h2>Quick access</h2><p>Tap a category to open its tools</p></div><div class="tiles" id="qa"></div></div>
    </div>
  </section>
  <!-- hubs.html and ai.html are fetched into these two panels -->
  <section class="panel" id="p-details"></section>
  <section class="panel" id="p-ai"></section>
</main>

<!-- iOS-style folder overlay -->
<div class="fo" id="fo" aria-hidden="true">
  <div class="fo-bd" id="fobd"></div>
  <div class="card fo-card" id="focard" role="dialog" aria-modal="true" aria-labelledby="fotitle" tabindex="-1">
    <h3 id="fotitle"></h3>
    <div class="fo-grid" id="fogrid"></div>
  </div>
</div>

<!-- preloader -->
<div class="loader" id="loader" role="status" aria-live="polite">
  <div class="sp" id="sp" aria-hidden="true"></div>
  <p id="ltxt">Loading…</p>
</div>

<div class="scrim"></div>
<div class="dock" id="dock">
  <div class="tabbar" id="tabbar"><div class="glass"></div><div class="pill" id="pill"><div class="clip"><div class="zoom" id="zoom" aria-hidden="true"><div class="items" id="zitems"></div></div></div></div><div class="items" id="items"></div></div>
  <button class="aibtn" id="aibtn" type="button" aria-label="Ask AI"><div class="glass"></div>
    <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
    <span class="label">AI</span>
  </button>
</div>

<script>
(function(){"use strict";
var $=function(i){return document.getElementById(i)};
function ck(n){var m=document.cookie.match(new RegExp("(?:^|; )"+n+"=([^;]*)"));return m?decodeURIComponent(m[1]):null}
var uid=ck("id"),name=ck("name");
if(!uid||!name){location.href="/login";return}

ma:{t:"MH Attendance",u:"/mh-attendance.html",i:"clock",c:"#FF9500"},
mp:{t:"MH Report",u:"/mh-report.html",i:"rep",c:"#E8590C"}};

{t:"Feedback",s:"Share your thoughts with us",c:"#FF2D55",i:"chat",u:"/feedback.html"}];

function tile(c,i){
var body='<span class="tt"><b>'+c.t+"</b><span>"+c.s+"</span></span>"+svg("go","go");
if(c.u)return'<a class="card tile" href="'+c.u+'" style="--c:'+c.c+'"><span class="ti">'+svg(c.i)+"</span>"+body+"</a>";
return'<button type="button" class="card tile" data-i="'+i+'" aria-haspopup="dialog" style="--c:'+c.c+'">'+folderIcon(c)+body+"</button>"}
$("qa").innerHTML=CATS.map(tile).join("");

var hr=new Date().getHours(),greet=hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";
var HEAD={
home:{eb:"Premium access",l1:greet+",",l2:name,w:1,sub:"Welcome to your VIP Panel."},
details:{eb:"Details",l1:"Your hubs,",l2:"all in one place",w:0,sub:"Fulfilment Center, Maersk and Mother Hub."},

function setHead(k){var h=HEAD[k],e=$("h1");$("eb").textContent=h.eb;$("sub").textContent=h.sub;e.textContent="";var s=document.createElement("small");s.textContent=h.l1;e.appendChild(s);e.appendChild(document.createTextNode(h.l2+" "));if(h.w){var w=document.createElement("span");w.className="wave";w.textContent="👋";e.appendChild(w)}}

$("ini").textContent=name.split(" ").filter(Boolean).map(function(w){return w[0]}).join("").slice(0,2).toUpperCase()||"--";
$("vn").textContent=name;$("vi").textContent=uid;$("vy").textContent=ck("vipType")||"Platinum";$("vs").textContent=ck("vipStatus")||"Active";
$("wrap").style.visibility="visible";
$("out").onclick=function(){["id","name","vip"].forEach(function(c){document.cookie=c+"=; Max-Age=0; path=/"});if("caches"in window)caches.keys().then(function(k){k.forEach(function(x){caches.delete(x)})});location.href="/login"};
var vc=$("vc");
vc.addEventListener("pointermove",function(e){if(e.pointerType==="touch")return;var r=vc.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;vc.style.transform="rotateY("+(x*10).toFixed(2)+"deg) rotateX("+(-y*10).toFixed(2)+"deg) scale(1.02)"});
vc.addEventListener("pointerleave",function(){vc.style.transform=""});

/* preloader spinner (12-bar iOS activity indicator) */
(function(){var s="";for(var n=0;n<12;n++)s+='<i style="--n:'+n+'"></i>';$("sp").innerHTML=s})();

/* ---------- helpers ---------- */
var clamp=function(v,a,b){return Math.min(b==null?1:b,Math.max(a==null?0:a,v))};
var haptic=function(){try{navigator.vibrate&&navigator.vibrate(7)}catch(e){}};
var calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
var fx=function(el,kf,o){return calm||el.animate(kf,o)};
function anim(el,kf,o){if(calm||!el.animate)return Promise.resolve();var a=el.animate(kf,o);return a.finished.catch(function(){})}

/* ---------- iOS-style folders ---------- */
var fo=$("fo"),foC=$("focard"),foBd=$("fobd"),foG=$("fogrid"),foT=$("fotitle"),foS=0,foTile=null; /* 0 closed · 1 opening · 2 open · 3 closing */
function xf(tr,fr){return"translate("+(tr.left-fr.left)+"px,"+(tr.top-fr.top)+"px) scale("+(tr.width/fr.width)+","+(tr.height/fr.height)+")"}
function openFolder(c,tile){
if(foS)return;foS=1;foTile=tile;
foT.textContent=c.t;
foG.innerHTML=c.k.map(function(k,n){var h=T[k];return'<a class="fi" href="'+h.u+'" style="--c:'+h.c+";--n:"+n+'"><span class="fic">'+svg(h.i)+"</span><span>"+h.t+"</span></a>"}).join("");
fo.classList.add("on");fo.setAttribute("aria-hidden","false");haptic();
var tr=tile.getBoundingClientRect(),fr=foC.getBoundingClientRect();
tile.classList.add("hid");
Promise.all([
anim(foBd,[{opacity:0},{opacity:1}],{duration:400,easing:"ease-out"}),
anim(foC,[{transform:xf(tr,fr),opacity:.5},{transform:"none",opacity:1}],{duration:580,easing:"cubic-bezier(.32,1.2,.4,1)"})
]).then(function(){if(foS===1){foS=2;foC.focus({preventScroll:true})}})}
function finishClose(){
if(foC.getAnimations)foC.getAnimations().concat(foBd.getAnimations()).forEach(function(a){a.cancel()});
fo.classList.remove("on","closing");fo.setAttribute("aria-hidden","true");
var t=foTile;foTile=null;foS=0;
if(t){t.classList.remove("hid");try{t.focus({preventScroll:true})}catch(e){}}}
function closeFolder(instant){
if(!foS)return;
if(instant){finishClose();return}
if(foS!==2)return;
foS=3;fo.classList.add("closing");
var tr=foTile.getBoundingClientRect(),fr=foC.getBoundingClientRect();
Promise.all([
anim(foBd,[{opacity:1},{opacity:0}],{duration:320,easing:"ease-in",fill:"forwards"}),
anim(foC,[{transform:"none",opacity:1},{transform:xf(tr,fr),opacity:0}],{duration:420,easing:"cubic-bezier(.32,.72,0,1)",fill:"forwards"})
]).then(finishClose)}
$("qa").addEventListener("click",function(e){var b=e.target.closest("button.tile");if(b)openFolder(CATS[+b.dataset.i],b)});
fo.addEventListener("click",function(e){if(!e.target.closest(".fo-card"))closeFolder()});
addEventListener("keydown",function(e){if(e.key==="Escape")closeFolder()});

/* ---------- liquid-glass nav (horizontal on phones, vertical on desktop) ---------- */
var TABS=[{k:"home",n:"Home",i:"home"},{k:"details",n:"Details",i:"hubs"}];
var dock=$("dock"),tabbar=$("tabbar"),pill=$("pill"),zoom=$("zoom"),aibtn=$("aibtn"),loaderEl=$("loader");
function mkItems(host,real){return TABS.map(function(t){var el=document.createElement(real?"button":"div");el.className="item";if(real){el.type="button";el.setAttribute("aria-label",t.n)}el.innerHTML=svg(t.i)+'<span class="label">'+t.n+"</span>";host.appendChild(el);return el})}
var items=mkItems($("items"),1),zoomItems=mkItems($("zitems"),0);
var bounce=function(i){return fx(items[i].firstChild,[{transform:"none"},{transform:"translateY(-6px) scale(.95,1.06)",offset:.28},{transform:"scale(1.07,.92)",offset:.58},{transform:"translateY(-1.5px) scale(.99,1.02)",offset:.78},{transform:"none"}],{duration:550,easing:"ease-out"})};

var mq=matchMedia("(min-width:720px)"),vert=mq.matches;
var off=function(el){return vert?el.offsetTop:el.offsetLeft},len=function(el){return vert?el.offsetHeight:el.offsetWidth},ax=function(e){return vert?e.clientY:e.clientX};
var current=0,view="home",pos={p:0,v:0},scl={p:1,v:0},press=null,drag=false,dragX=null,hov=-1,vel=0,lx=0,lt=0,compact=false,prev=0,until=0,run=false,lw=0,lv=null,wasLens=false;
var spring=function(s,t,k,d,dt){s.v+=(-k*(s.p-t)-d*s.v)*dt;s.p+=s.v*dt};
function tick(now){
var dt=Math.min(.03,(now-prev)/1000);prev=now;
var it=items[current],sz=len(it),target=dragX!==null?dragX:off(it);
var moving=drag||Math.abs(pos.v)>40||Math.abs(pos.p-target)>2;
spring(pos,target,340,27,dt);spring(scl,moving?1.25:1,420,27,dt);
var idle=!drag&&dragX===null&&Math.abs(pos.p-target)<.25&&Math.abs(pos.v)<6&&Math.abs(scl.p-1)<.002&&Math.abs(scl.v)<.05;
if(idle){pos.p=target;pos.v=0;scl.p=1;scl.v=0}
var z=clamp((scl.p-1)/.25),lens=z>.01,st=idle?0:Math.min(.3,Math.abs(pos.v)/2200);
if(sz!==lw||vert!==lv){if(vert){pill.style.width="";pill.style.height=sz+"px"}else{pill.style.height="";pill.style.width=sz+"px"}lw=sz;lv=vert}
var a=scl.p*(1+st),b=scl.p*(1-st*.5);
pill.style.transform=vert?"translate3d(0,"+pos.p+"px,0) scale("+b+","+a+")":"translate3d("+pos.p+"px,0,0) scale("+a+","+b+")";
if(lens||wasLens){pill.style.setProperty("--z",lens?z.toFixed(3):0);zoom.style.transform=vert?"translate3d(0,"+(-pos.p)+"px,0)":"translate3d("+(-pos.p)+"px,0,0)";pill.classList.toggle("lens",lens)}
wasLens=lens;
if(!idle||now<until)requestAnimationFrame(tick);else run=false}
function wake(ms){until=Math.max(until,performance.now()+(ms||0));if(!run){run=true;prev=performance.now();requestAnimationFrame(tick)}}
new ResizeObserver(function(){pill.style.setProperty("--tw",tabbar.offsetWidth+"px");pill.style.setProperty("--th",tabbar.offsetHeight+"px");wake(150)}).observe(tabbar);
mq.addEventListener("change",function(){vert=mq.matches;lw=0;if(vert)setDock("min",false);pos.v=0;scl.p=1;scl.v=0;requestAnimationFrame(function(){pos.p=off(items[current]);wake(200)})});
function setDock(c,on){if(dock.classList.contains(c)===on)return;dock.classList.toggle(c,on);wake(750)}

/* ---------- loading hubs.html / ai.html inside this page ---------- */
var PAGES={details:{url:"/hubs.html",label:"Loading hubs…"},ai:{url:"/ai.html",label:"Loading AI…"}};
var loaded={},loading={},sheets={};
function syncLoader(){var p=PAGES[view],on=!!(p&&loading[view]);loaderEl.classList.toggle("on",on);if(on)$("ltxt").textContent=p.label}
function applySheets(){for(var k in sheets)sheets[k].forEach(function(n){n.disabled=(k!==view)})}
function shimReady(){ /* lets fetched scripts that wait for DOMContentLoaded/load still run */
var dA=document.addEventListener,wA=window.addEventListener;
function mk(orig,ctx){return function(t,f,o){if((t==="DOMContentLoaded"||t==="load")&&f){setTimeout(function(){try{typeof f==="function"?f.call(ctx,new Event(t)):f.handleEvent(new Event(t))}catch(e){console.error(e)}},0);return}return orig.call(ctx,t,f,o)}}
document.addEventListener=mk(dA,document);window.addEventListener=mk(wA,window);
return function(){delete document.addEventListener;delete window.addEventListener}}
function runScripts(host,list){
var restore=shimReady();
return list.reduce(function(p,old){return p.then(function(){return new Promise(function(res){
var s=document.createElement("script");
for(var i=0;i<old.attributes.length;i++)s.setAttribute(old.attributes[i].name,old.attributes[i].value);
s.async=false;
if(old.getAttribute("src")){s.onload=s.onerror=function(){res()}}else{s.text=old.textContent}
host.appendChild(s);
if(!old.getAttribute("src"))res()})})},Promise.resolve()).then(restore,restore)}
function inject(k,html){
var doc=new DOMParser().parseFromString(html,"text/html"),host=$("p-"+k),nodes=[];
doc.querySelectorAll('style,link[rel~="stylesheet"]').forEach(function(n){var c=document.importNode(n,true);n.remove();document.head.appendChild(c);nodes.push(c)});
sheets[k]=nodes;applySheets();
var scripts=[].slice.call(doc.querySelectorAll("script"));scripts.forEach(function(s){s.remove()});
host.innerHTML=doc.body.innerHTML;
return runScripts(host,scripts)}
function fail(k,err){
console.warn("Could not load "+PAGES[k].url,err);
$("p-"+k).innerHTML='<div class="card err"><b>Couldn\'t load this page</b><p>Check your connection and try again.</p><button type="button" class="sg" data-retry="'+k+'">Try again</button></div>'}
function loadPage(k){
var cfg=PAGES[k];if(!cfg||loaded[k]||loading[k])return;
var t0=Date.now();$("p-"+k).innerHTML="";loading[k]=1;syncLoader();
fetch(cfg.url,{credentials:"same-origin",cache:"no-cache"})
.then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text()})
.then(function(html){return new Promise(function(res){setTimeout(res,Math.max(0,500-(Date.now()-t0)))}).then(function(){return inject(k,html)})})
.then(function(){loaded[k]=1})
.catch(function(err){fail(k,err)})
.then(function(){delete loading[k];syncLoader();applySheets()})}
document.addEventListener("click",function(e){var b=e.target.closest("[data-retry]");if(b)loadPage(b.dataset.retry)});

/* ---------- view switching ---------- */
function showPanel(k){document.querySelectorAll(".panel").forEach(function(p){p.classList.toggle("on",p.id==="p-"+k)});setHead(k);scrollTo({top:0});try{history.replaceState(null,"","#"+k)}catch(e){}applySheets();syncLoader()}
function setView(k){
closeFolder(true);view=k;var ai=k==="ai";
if(!ai){current=TABS.findIndex(function(t){return t.k===k});items.forEach(function(el,n){el.classList.toggle("on",n===current);el.classList.remove("hover");zoomItems[n].classList.toggle("on",n===current);zoomItems[n].classList.remove("hover")})}
tabbar.classList.toggle("dim",ai);aibtn.classList.toggle("on",ai);
showPanel(k);loadPage(k);wake()}
function selectTab(i,quiet){setView(TABS[i].k);if(!quiet){bounce(i);haptic()}}
var hit=function(p){var r=tabbar.getBoundingClientRect();return clamp(Math.floor((p-(vert?r.top:r.left)-off(items[0]))/len(items[0])),0,items.length-1)};
var setHover=function(h){hov=h;items.forEach(function(el,k){el.classList.toggle("hover",k===h);zoomItems[k].classList.toggle("hover",k===h)})};
function dragPill(e){var r=tabbar.getBoundingClientRect(),w=len(items[0]),now=performance.now(),min=off(items[0]),max=off(items[items.length-1]),p=ax(e);
vel=.7*vel+.3*((p-lx)/(now-lt+1));lx=p;lt=now;
var x=p-(vert?r.top:r.left)-w/2;if(x<min)x=min+(x-min)*.3;if(x>max)x=max+(x-max)*.3;dragX=x;
var h=clamp(Math.round((x-min)/w),0,items.length-1);if(h!==hov){setHover(h);haptic()}}
tabbar.addEventListener("pointerdown",function(e){
if(dock.classList.contains("min")){compact=true;return}
tabbar.setPointerCapture(e.pointerId);var i=hit(ax(e));press={x:ax(e),i:i,re:i===current&&view!=="ai"};vel=0;lx=ax(e);lt=performance.now();
if(!press.re){selectTab(i);wake()}});
tabbar.addEventListener("pointermove",function(e){if(!press)return;if(!drag){if(Math.abs(ax(e)-press.x)<8)return;drag=true;hov=-1}dragPill(e);wake()});
tabbar.addEventListener("pointerup",function(){
if(compact){compact=false;setDock("min",false);return}
if(!press)return;var p=press,was=drag,i=p.i;press=null;drag=false;
if(was){var w=len(items[0]),min=off(items[0]);i=clamp(Math.round((dragX+vel*160-min)/w),0,items.length-1);dragX=null;setHover(-1)}
if(i!==current)selectTab(i);else if(p.re){scrollTo({top:0,behavior:"smooth"});bounce(current);haptic()}
wake()});
tabbar.addEventListener("pointercancel",function(){compact=false;press=null;drag=false;dragX=null;setHover(-1);wake()});
items.forEach(function(el,k){el.addEventListener("click",function(e){if(e.detail===0&&(k!==current||view==="ai"))selectTab(k)})});
aibtn.addEventListener("click",function(){if(view==="ai"){scrollTo({top:0,behavior:"smooth"});return}setView("ai");haptic()});

var ly=0;addEventListener("scroll",function(){var y=scrollY;if(!vert){if(y>ly+3&&y>70)setDock("min",true);else if(y<ly-3||y<12)setDock("min",false)}ly=y},{passive:true});

var h0=location.hash.slice(1),first=({home:1,details:1,ai:1})[h0]?h0:"home";
setView(first);scrollTo(0,0);
requestAnimationFrame(function(){pos.p=off(items[current]);wake()});
addEventListener("pageshow",function(e){if(e.persisted){closeFolder(true);wake()}});
})();
</script>
