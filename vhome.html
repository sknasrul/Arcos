<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#F2F2F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VIP Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F2F7;--card:rgba(255,255,255,.74);--stroke:rgba(255,255,255,.85);--fill:rgba(120,120,128,.10);--hair:rgba(60,60,67,.11);
--ink:#1C1C1E;--ink2:rgba(60,60,67,.72);--ink3:rgba(60,60,67,.5);--blue:#007AFF;--gold:#C9962E;--gold2:#F6D365;
--shadow:0 1px 1px rgba(0,0,0,.03),0 8px 24px -10px rgba(40,40,70,.16),0 24px 48px -28px rgba(40,40,70,.18);--lift:0 2px 2px rgba(0,0,0,.04),0 16px 36px -12px rgba(40,40,70,.24),0 36px 64px -30px rgba(40,40,70,.26);
--spring:cubic-bezier(.32,1.25,.4,1);--soft:cubic-bezier(.32,.72,0,1);--out:cubic-bezier(.22,1,.36,1);--bounce:cubic-bezier(.34,1.56,.64,1);
--gs:'Google Sans','Product Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.4 var(--ui);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:3px;border-radius:14px}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;opacity:.55;will-change:transform}
.aurora i:nth-child(1){width:660px;height:660px;left:-210px;top:-190px;background:radial-gradient(closest-side,#9CC8FF 30%,rgba(156,200,255,0));animation:d1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:600px;height:600px;right:-190px;top:50px;background:radial-gradient(closest-side,#F6D9A0 30%,rgba(246,217,160,0));animation:d2 32s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:660px;height:660px;left:calc(28% - 70px);top:490px;background:radial-gradient(closest-side,#C9B8FF 30%,rgba(201,184,255,0));opacity:.4;animation:d3 38s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(90px,70px) scale(1.12)}}@keyframes d2{to{transform:translate(-80px,90px) scale(1.08)}}@keyframes d3{to{transform:translate(-110px,-60px) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- navigation: iOS tab bar by default, macOS-style sidebar on wide screens ---------- */
.nav{position:fixed;z-index:30;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);width:min(calc(100% - 28px),460px);padding:6px;border-radius:34px;
touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 18px 40px -12px rgba(30,30,60,.32),0 2px 8px rgba(30,30,60,.1);animation:rise .8s var(--out) .1s backwards}
.nav::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:0;background:linear-gradient(155deg,rgba(255,255,255,.58),rgba(255,255,255,.2) 55%,rgba(255,255,255,.42));-webkit-backdrop-filter:blur(20px) saturate(230%) brightness(1.06);backdrop-filter:blur(20px) saturate(230%) brightness(1.06)}
.nav::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:0;pointer-events:none;box-shadow:inset 1.5px 1.5px 1px rgba(255,255,255,.95),inset -1.5px -1.5px 1px rgba(255,255,255,.8),inset 8px 8px 14px -10px rgba(110,170,255,.5),inset -8px -8px 14px -10px rgba(255,140,200,.4),inset 0 0 16px rgba(255,255,255,.3),0 0 0 .5px rgba(60,60,67,.12)}
.its{position:relative;z-index:2;display:flex}
.pill{position:absolute;z-index:1;left:0;top:0;width:0;height:0;border-radius:26px;background:rgba(255,255,255,.82);box-shadow:0 4px 12px rgba(0,0,0,.1),inset 0 1px 0 #fff,0 0 0 .5px rgba(60,60,67,.08);will-change:transform}
.nav.rdy .pill{transition:left .55s var(--spring),top .55s var(--spring),width .55s var(--spring),height .55s var(--spring),transform .45s var(--spring),box-shadow .3s}
.nav.press .pill{transform:scale(1.13);background:rgba(255,255,255,.97);box-shadow:0 12px 28px -6px rgba(0,0,0,.25),inset 0 1px 0 #fff}
.it{position:relative;flex:1 1 0;min-width:0;height:58px;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:26px;font-size:10.5px;font-weight:600;color:var(--ink2);transition:color .25s}
.it svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s var(--bounce)}
.it.on,.it.hv{color:var(--blue)}.it.on svg{transform:translateY(-1px)}.it:active svg{transform:scale(.86)}
.it.lk{color:var(--ink3)}.it .lb{position:absolute;top:8px;left:calc(50% + 6px);width:15px;height:15px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.it .lb svg{width:9px;height:9px;stroke-width:2.8;color:var(--gold)}
@media(min-width:720px){
.nav{left:20px;top:24px;bottom:auto;transform:none;width:82px;animation-name:rise}
.its{flex-direction:column}.it{flex:none;height:70px}}

/* ---------- page ---------- */
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 30px) 20px 150px}
@media(min-width:720px){.wrap{padding:44px 40px 60px 132px}}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:28px}
.eyebrow{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px}
.vip{font:700 11.5px var(--gs);letter-spacing:.05em;color:#3a2a05;background:linear-gradient(135deg,#F6D365,#D9A441);padding:3px 10px;border-radius:999px;box-shadow:0 4px 10px -3px rgba(217,164,65,.6),inset 0 1px 0 rgba(255,255,255,.5)}
h1{font:700 clamp(32px,6vw,52px)/1.05 var(--gs);letter-spacing:-.03em}h1 small{display:block;font:500 clamp(17px,3vw,22px)/1.3 var(--gs);letter-spacing:0;color:var(--ink2);margin-bottom:2px}
.wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(10deg)}50%{transform:rotate(0)}}
.sub{margin-top:10px;font-size:14.5px;color:var(--ink2)}
.user{display:flex;align-items:center;gap:12px;flex-shrink:0}
.gb{position:relative;isolation:isolate;width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 26px -8px rgba(30,30,60,.28),0 2px 6px rgba(30,30,60,.1);transition:transform .5s var(--bounce)}
.gb::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-2;background:linear-gradient(155deg,rgba(255,255,255,.5),rgba(255,255,255,.12) 55%,rgba(255,255,255,.3));-webkit-backdrop-filter:blur(10px) saturate(230%);backdrop-filter:blur(10px) saturate(230%)}
.gb::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;box-shadow:inset 1.5px 1.5px 1px rgba(255,255,255,.95),inset -1.5px -1.5px 1px rgba(255,255,255,.8),inset 7px 7px 12px -9px rgba(110,170,255,.55),inset -7px -7px 12px -9px rgba(255,140,200,.45),0 0 0 .5px rgba(60,60,67,.12)}
.gb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.gb:active{transform:scale(.88)}
@media(hover:hover){.gb:hover{transform:scale(1.07)}}
.av{position:relative;width:56px;height:56px;border-radius:50%;box-shadow:0 0 18px 2px rgba(246,211,101,.4)}
.av .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#CAA04D,#F6D365,#FFF3D1,#CAA04D);animation:spin 6s linear infinite}
.av b{position:absolute;inset:3px;border-radius:50%;background:#fff;display:grid;place-items:center;font:500 17px var(--gs);color:var(--ink)}
.av u{position:absolute;right:0;bottom:0;width:14px;height:14px;border-radius:50%;background:#34C759;border:2.5px solid var(--bg);animation:pulse 2.4s ease-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,89,.5)}70%,100%{box-shadow:0 0 0 7px rgba(52,199,89,0)}}

.panel{display:none}.panel.on{display:block;animation:rise .7s var(--out) backwards}
.home{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:26px;align-items:start}
.sh{margin:0 4px 12px}.sh h2{font:700 22px var(--gs);letter-spacing:-.02em}.sh p{font-size:13.5px;color:var(--ink2);margin-top:2px}
.group{margin-bottom:34px}.tiles{display:grid;gap:12px}.group .tiles{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{position:relative;background:var(--card);border:1px solid var(--stroke);border-radius:28px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 .5px rgba(60,60,67,.05)}
.tile{display:flex;align-items:center;gap:15px;padding:16px 18px;transition:transform .5s var(--soft),box-shadow .5s var(--soft)}
@media(hover:hover){.tile:hover{transform:translateY(-3px);box-shadow:var(--lift)}.tile:hover .go{transform:translateX(3px);color:var(--c)}}
.tile:active{transform:scale(.985)}
.ti{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex-shrink:0;color:#fff;background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 68%,#000));box-shadow:0 10px 18px -8px var(--c),inset 0 1px 0 rgba(255,255,255,.4)}
.ti svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tt{flex:1;min-width:0}.tt b{display:block;font:500 17px var(--gs);letter-spacing:-.01em}.tt span{font-size:12.5px;color:var(--ink2)}
.go{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;color:var(--ink3);transition:transform .4s var(--soft),color .3s}

/* VIP card (true credit-card proportions) */
.stage{perspective:1000px}
.vc{position:relative;width:100%;aspect-ratio:85.6/53.98;border-radius:24px;padding:24px 28px;color:#f5f1e6;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
background:radial-gradient(130% 110% at 100% 100%,rgba(201,140,60,.6) 0%,rgba(140,92,44,.22) 32%,transparent 60%),linear-gradient(160deg,#1b1c25 0%,#111119 45%,#0c0c11 100%);
border:1px solid rgba(246,211,101,.4);box-shadow:0 30px 50px -22px rgba(60,40,10,.55),0 0 0 1px rgba(246,211,101,.08) inset;transition:transform .35s var(--out),box-shadow .35s;transform-style:preserve-3d;will-change:transform}
.vc::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(122deg,transparent 32%,rgba(255,255,255,.05) 42%,rgba(255,255,255,.17) 48%,rgba(255,255,255,.07) 54%,transparent 64%)}
.vc>*{position:relative}.vt{display:flex;align-items:center;justify-content:space-between}
.vb{display:flex;align-items:center;gap:7px;color:#F6D365;font-size:13px;font-weight:800;letter-spacing:.06em}.vb svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{width:48px;height:33px;border-radius:7px;background:linear-gradient(135deg,#c99a4e,#f4e2ad 45%,#e2c288 70%,#b8894a);box-shadow:0 3px 8px rgba(0,0,0,.4)}
.vg{font-size:10px;font-weight:700;letter-spacing:.12em;color:rgba(245,241,230,.45)}
.vn{margin-top:10px;font:500 clamp(19px,5.4vw,25px) var(--gs);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vd{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}.vd .full{grid-column:1/-1}
.vd small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.12em;color:rgba(245,241,230,.45);margin-bottom:3px}.vd b{font-size:14.5px;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,16px);z-index:60;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s,transform .5s var(--bounce);
background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--stroke);box-shadow:var(--lift);max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:720px){.toast{bottom:28px}}
@media(max-width:719px){
.it.lk{display:none}
.nav{width:min(calc(100% - 28px),340px)}}
@media(max-width:899px){.home{grid-template-columns:1fr;gap:22px}.stage{max-width:430px}}
@media(max-width:719px){.top{margin-bottom:22px}.gb.out{order:2}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}.aurora i{animation:none}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<nav class="nav" id="nav" aria-label="Main navigation"><div class="pill" id="pill"></div><div class="its" id="its"></div></nav>

<main class="wrap" id="wrap" style="visibility:hidden">
  <header class="top">
    <div>
      <div class="eyebrow"><span class="vip">VIP</span><span id="eb"></span></div>
      <h1 id="h1"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="user">
      <button class="gb out" id="out" type="button" aria-label="Log out"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></button>
      <div class="av" aria-hidden="true"><i class="ring"></i><b id="ini">--</b><u></u></div>
    </div>
  </header>

  <section class="panel on" id="p-home">
    <div class="home">
      <div class="stage"><div class="vc" id="vc">
        <div class="vt"><div class="vb"><svg viewBox="0 0 24 24"><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7Z"/><path d="M5 20h14"/></svg>VIP ACCESS</div><div class="chip"></div></div>
        <div><div class="vg">PREMIUM ACCESS GRANTED</div><div class="vn" id="vn">—</div></div>
        <div class="vd"><div><small>ARCOS ID</small><b id="vi">—</b></div><div><small>TYPE</small><b id="vy">Platinum</b></div><div class="full"><small>STATUS</small><b id="vs">Active</b></div></div>
      </div></div>
      <div><div class="sh"><h2>Quick access</h2><p>Jump straight into your tools</p></div><div class="tiles" id="qa"></div></div>
    </div>
  </section>

  <section class="panel" id="p-hubs">
    <div class="group"><div class="sh"><h2>Fulfilment Center</h2><p>Attendance and productivity for the site</p></div><div class="tiles" id="fcT"></div></div>
    <div class="group"><div class="sh"><h2>Mother Hub</h2><p>Hub management</p></div><div class="tiles" id="mhT"></div></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){"use strict";
var $=function(i){return document.getElementById(i)};
function ck(n){var m=document.cookie.match(new RegExp("(?:^|; )"+n+"=([^;]*)"));return m?decodeURIComponent(m[1]):null}
var uid=ck("id"),name=ck("name");
if(!uid||!name){location.href="/login";return}
if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(e){console.warn("Service worker registration failed:",e)})});

var P='fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"';
var IC={
home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
hubs:'<path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 9h1M9 13h1M14 9h1M14 13h1"/><path d="M10 21v-4h4v4"/>',
forms:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/>',
sched:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
pres:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M17 11l2 2 4-4"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
rep:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 17v-2M12 17v-5M15 17v-3"/>',
mh:'<circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.2 16.2l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.2 7.8l2.8-2.8"/>',
go:'<path d="M9 6l6 6-6 6"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'};
var svg=function(k,cls){return'<svg viewBox="0 0 24 24" '+P+(cls?' class="'+cls+'"':"")+">"+IC[k]+"</svg>"};

/* nav: panels switch in place, "u" items navigate, "lock" items are unavailable */
var NAV=[{k:"home",l:"Home",i:"home"},{k:"hubs",l:"Hubs",i:"hubs"},{k:"forms",l:"Forms",i:"forms",u:"/forms"},{k:"schedules",l:"Schedules",i:"sched",lock:1},{k:"present",l:"Present",i:"pres",lock:1}];
var HUBS=[{t:"FC Attendance",s:"Daily attendance ledger",u:"/fc",i:"clock",c:"#34C759",g:"fc"},{t:"FC Report",s:"Live productivity analysis",u:"/fcreport",i:"rep",c:"#5856D6",g:"fc"},{t:"Mother Hub",s:"Open hub management",u:"/mh.html",i:"mh",c:"#FF9500",g:"mh"}];
var FORMS={t:"Forms",s:"Submit and track forms",u:"/forms",i:"forms",c:"#007AFF"};
function tile(h){return'<a class="card tile" href="'+h.u+'" style="--c:'+h.c+'"><span class="ti">'+svg(h.i)+'</span><span class="tt"><b>'+h.t+"</b><span>"+h.s+"</span></span>"+svg("go","go")+"</a>"}
$("qa").innerHTML=HUBS.concat([FORMS]).map(tile).join("");
$("fcT").innerHTML=HUBS.filter(function(h){return h.g==="fc"}).map(tile).join("");
$("mhT").innerHTML=HUBS.filter(function(h){return h.g==="mh"}).map(tile).join("");

/* header text per panel */
var hr=new Date().getHours(),greet=hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";
var HEAD={home:{eb:"Premium access",l1:greet+",",l2:name,w:1,sub:"Welcome to your VIP Panel."},hubs:{eb:"Hubs Management",l1:"Your",l2:"Hubs",w:0,sub:"Fulfilment Center reports and the Mother Hub."}};
function setHead(k){var h=HEAD[k],e=$("h1");$("eb").textContent=h.eb;$("sub").textContent=h.sub;e.textContent="";var s=document.createElement("small");s.textContent=h.l1;e.appendChild(s);e.appendChild(document.createTextNode(h.l2+" "));if(h.w){var w=document.createElement("span");w.className="wave";w.textContent="👋";e.appendChild(w)}}

/* user + card */
$("ini").textContent=name.split(" ").filter(Boolean).map(function(w){return w[0]}).join("").slice(0,2).toUpperCase()||"--";
$("vn").textContent=name;$("vi").textContent=uid;$("vy").textContent=ck("vipType")||"Platinum";$("vs").textContent=ck("vipStatus")||"Active";
$("wrap").style.visibility="visible";
$("out").onclick=function(){["id","name","vip"].forEach(function(c){document.cookie=c+"=; Max-Age=0; path=/"});if("caches"in window)caches.keys().then(function(k){k.forEach(function(x){caches.delete(x)})});location.href="/login"};
var vc=$("vc");
vc.addEventListener("pointermove",function(e){if(e.pointerType==="touch")return;var r=vc.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;vc.style.transform="rotateY("+(x*10).toFixed(2)+"deg) rotateX("+(-y*10).toFixed(2)+"deg) scale(1.02)"});
vc.addEventListener("pointerleave",function(){vc.style.transform=""});

/* toast */
var tEl=$("toast"),tm;function toast(m){tEl.textContent=m;tEl.classList.add("show");clearTimeout(tm);tm=setTimeout(function(){tEl.classList.remove("show")},2400)}
function haptic(){try{navigator.vibrate&&navigator.vibrate(7)}catch(e){}}

/* nav build + liquid pill */
var nav=$("nav"),pill=$("pill"),its=$("its"),btns=[],cur=null;
NAV.forEach(function(n,i){var b=document.createElement("button");b.type="button";b.className="it"+(n.lock?" lk":"");b.dataset.i=i;
b.innerHTML=svg(n.i)+"<span>"+n.l+"</span>"+(n.lock?'<span class="lb">'+svg("lock")+"</span>":"");b.setAttribute("aria-label",n.l+(n.lock?" (not available)":""));its.appendChild(b);btns.push(b)});
function place(b){if(!b)return;var r=b.getBoundingClientRect(),o=nav.getBoundingClientRect(),s=pill.style;s.left=(r.left-o.left)+"px";s.top=(r.top-o.top)+"px";s.width=r.width+"px";s.height=r.height+"px"}
function show(k){document.querySelectorAll(".panel").forEach(function(p){p.classList.toggle("on",p.id==="p-"+k)});setHead(k);scrollTo({top:0,behavior:"smooth"});try{history.replaceState(null,"","#"+k)}catch(e){}}
function mark(b){btns.forEach(function(x){x.classList.toggle("on",x===b);x.classList.remove("hv");if(x===b)x.setAttribute("aria-current","page");else x.removeAttribute("aria-current")})}
function activate(b){var n=NAV[+b.dataset.i];
if(n.lock){place(cur);mark(cur);toast("Not available for you");haptic();return}
if(n.u){place(b);mark(b);haptic();setTimeout(function(){location.href=n.u},240);return}
if(b!==cur){cur=b;show(n.k);haptic()}place(cur);mark(cur)}
function at(x,y){var best=null,bd=1e9;btns.forEach(function(b){var r=b.getBoundingClientRect(),d=Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2));if(d<bd){bd=d;best=b}});return best}
var press=null,hov=null;
nav.addEventListener("pointerdown",function(e){var b=e.target.closest(".it");if(!b)return;nav.setPointerCapture(e.pointerId);press=1;hov=b;nav.classList.add("press");place(b);b.classList.add("hv")});
nav.addEventListener("pointermove",function(e){if(!press)return;var b=at(e.clientX,e.clientY);if(b&&b!==hov){hov.classList.remove("hv");hov=b;b.classList.add("hv");place(b);haptic()}});
nav.addEventListener("pointerup",function(){if(!press)return;press=null;nav.classList.remove("press");var b=hov;hov=null;if(b){b.classList.remove("hv");activate(b)}});
nav.addEventListener("pointercancel",function(){press=null;hov=null;nav.classList.remove("press");btns.forEach(function(x){x.classList.remove("hv")});place(cur)});
nav.addEventListener("click",function(e){if(e.detail!==0)return;var b=e.target.closest(".it");if(b)activate(b)});
nav.addEventListener("keydown",function(e){var k=e.key,v=btns.filter(function(b){return b.offsetParent!==null}),i=v.indexOf(document.activeElement);if(i<0)return;var d=(k==="ArrowRight"||k==="ArrowDown")?1:(k==="ArrowLeft"||k==="ArrowUp")?-1:0;if(d){e.preventDefault();v[(i+d+v.length)%v.length].focus()}});
function resync(){place(cur)}
addEventListener("resize",resync);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(resync);

var start=NAV.findIndex(function(n){return n.k===location.hash.slice(1)&&!n.u&&!n.lock});if(start<0)start=0;
cur=btns[start];mark(cur);show(NAV[start].k);window.scrollTo(0,0);place(cur);requestAnimationFrame(function(){requestAnimationFrame(function(){nav.classList.add("rdy")})});
addEventListener("pageshow",function(e){if(e.persisted){mark(cur);place(cur)}});
})();
</script>
</body>
</html>
