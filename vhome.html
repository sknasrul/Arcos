<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VIP Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f2f2f7;--fg:#1c1c1e;--fg2:rgba(60,60,67,.74);--sub:rgba(60,60,67,.55);--tint:#007aff;--ai:#7a5cff;
--card:rgba(255,255,255,.74);--stroke:rgba(255,255,255,.85);--glass:rgba(255,255,255,.3);--pill:rgba(120,120,128,.18);--rim1:rgba(255,255,255,.95);--rim2:rgba(255,255,255,.55);--lensbg:rgba(255,255,255,.94);--shadow:rgba(40,40,70,.2);
--a1:#9cc8ff;--a2:#f6d9a0;--a3:#c9b8ff;--ao:.55;
--spring:cubic-bezier(.32,1.25,.4,1);--soft:cubic-bezier(.32,.72,0,1);--out:cubic-bezier(.22,1,.36,1);--bounce:cubic-bezier(.34,1.56,.64,1);
--gs:'Google Sans','Product Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
[data-theme=dark]{color-scheme:dark;--bg:#000;--fg:#fff;--fg2:rgba(255,255,255,.72);--sub:rgba(235,235,245,.6);--tint:#0a84ff;--ai:#9b8cff;
--card:rgba(44,44,48,.55);--stroke:rgba(255,255,255,.1);--glass:rgba(44,44,48,.38);--pill:rgba(255,255,255,.14);--rim1:rgba(255,255,255,.5);--rim2:rgba(255,255,255,.2);--lensbg:rgba(76,76,82,.94);--shadow:rgba(0,0,0,.6);
--a1:#0b4a9e;--a2:#7a5410;--a3:#4b2fa8;--ao:.42}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;background:var(--bg);color:var(--fg);font:15px/1.4 var(--ui);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--tint);outline-offset:3px;border-radius:14px}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;opacity:var(--ao);will-change:transform}
.aurora i:nth-child(1){width:660px;height:660px;left:-210px;top:-190px;background:radial-gradient(closest-side,var(--a1) 30%,transparent);animation:d1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:600px;height:600px;right:-190px;top:50px;background:radial-gradient(closest-side,var(--a2) 30%,transparent);animation:d2 32s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:660px;height:660px;left:calc(28% - 70px);top:490px;background:radial-gradient(closest-side,var(--a3) 30%,transparent);animation:d3 38s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(90px,70px) scale(1.12)}}@keyframes d2{to{transform:translate(-80px,90px) scale(1.08)}}@keyframes d3{to{transform:translate(-110px,-60px) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(10deg)}50%{transform:rotate(0)}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,89,.5)}70%,100%{box-shadow:0 0 0 7px rgba(52,199,89,0)}}@keyframes bl{50%{opacity:.35}}

/* page */
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 30px) 20px 160px}
@media(min-width:720px){.wrap{padding:112px 40px 60px}}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:28px}
.eyebrow{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--fg2);margin-bottom:10px}
.vip{font:700 11.5px var(--gs);letter-spacing:.05em;color:#3a2a05;background:linear-gradient(135deg,#F6D365,#D9A441);padding:3px 10px;border-radius:999px;box-shadow:0 4px 10px -3px rgba(217,164,65,.6),inset 0 1px 0 rgba(255,255,255,.5)}
h1{font:700 clamp(32px,6vw,52px)/1.05 var(--gs);letter-spacing:-.03em}h1 small{display:block;font:500 clamp(17px,3vw,22px)/1.3 var(--gs);letter-spacing:0;color:var(--fg2);margin-bottom:2px}
.wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.4s ease-in-out infinite}
.sub{margin-top:10px;font-size:14.5px;color:var(--fg2)}
.user{display:flex;align-items:center;gap:12px;flex-shrink:0}
.gb{position:relative;width:46px;height:46px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--fg);cursor:pointer;transition:transform .5s var(--bounce)}
.gb svg{position:relative;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.gb:active{transform:scale(.88)}
.av{position:relative;width:56px;height:56px;border-radius:50%;box-shadow:0 0 18px 2px rgba(246,211,101,.4)}
.av .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#CAA04D,#F6D365,#FFF3D1,#CAA04D);animation:spin 6s linear infinite}
.av b{position:absolute;inset:3px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:500 17px var(--gs);color:var(--fg)}
.av u{position:absolute;right:0;bottom:0;width:14px;height:14px;border-radius:50%;background:#34C759;border:2.5px solid var(--bg);animation:pulse 2.4s ease-out infinite}
.panel{display:none}.panel.on{display:block;animation:rise .6s var(--out) backwards}
.home{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:26px;align-items:start}
@media(max-width:899px){.home{grid-template-columns:1fr;gap:22px}.stage{max-width:430px}}
.sh{margin:0 4px 12px}.sh h2{font:700 22px var(--gs);letter-spacing:-.02em}.sh p{font-size:13.5px;color:var(--fg2);margin-top:2px}
.group{margin-bottom:30px}.tiles{display:grid;gap:12px}.group .tiles{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{position:relative;background:var(--card);border:1px solid var(--stroke);border-radius:28px;box-shadow:0 1px 1px rgba(0,0,0,.03),0 10px 26px -12px var(--shadow);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 var(--rim2)}
.tile{display:flex;align-items:center;gap:15px;padding:16px 18px;transition:transform .5s var(--soft),box-shadow .5s var(--soft)}
@media(hover:hover){.tile:hover{transform:translateY(-3px);box-shadow:0 2px 2px rgba(0,0,0,.04),0 18px 36px -12px var(--shadow)}.tile:hover .go{transform:translateX(3px);color:var(--c)}}
.tile:active{transform:scale(.985)}
.ti{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex-shrink:0;color:#fff;background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 68%,#000));box-shadow:0 10px 18px -8px var(--c),inset 0 1px 0 rgba(255,255,255,.4)}
.ti svg{width:24px;height:24px;stroke-width:1.9}
.tt{flex:1;min-width:0}.tt b{display:block;font:500 17px var(--gs);letter-spacing:-.01em}.tt span{font-size:12.5px;color:var(--fg2)}
.go{width:18px;height:18px;stroke-width:2.6;color:var(--sub);transition:transform .4s var(--soft),color .3s}

/* VIP card */
.stage{perspective:1000px}
.vc{position:relative;width:100%;aspect-ratio:85.6/53.98;border-radius:24px;padding:24px 28px;color:#f5f1e6;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
background:radial-gradient(130% 110% at 100% 100%,rgba(201,140,60,.6) 0%,rgba(140,92,44,.22) 32%,transparent 60%),linear-gradient(160deg,#1b1c25 0%,#111119 45%,#0c0c11 100%);
border:1px solid rgba(246,211,101,.4);box-shadow:0 30px 50px -22px rgba(60,40,10,.55);transition:transform .35s var(--out);transform-style:preserve-3d;will-change:transform}
.vc::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(122deg,transparent 32%,rgba(255,255,255,.05) 42%,rgba(255,255,255,.17) 48%,rgba(255,255,255,.07) 54%,transparent 64%)}
.vc>*{position:relative}.vt{display:flex;align-items:center;justify-content:space-between}
.vb{display:flex;align-items:center;gap:7px;color:#F6D365;font-size:13px;font-weight:800;letter-spacing:.06em}.vb svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{width:48px;height:33px;border-radius:7px;background:linear-gradient(135deg,#c99a4e,#f4e2ad 45%,#e2c288 70%,#b8894a);box-shadow:0 3px 8px rgba(0,0,0,.4)}
.vg{font-size:10px;font-weight:700;letter-spacing:.12em;color:rgba(245,241,230,.45)}
.vn{margin-top:10px;font:500 clamp(19px,5.4vw,25px) var(--gs);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vd{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}.vd .full{grid-column:1/-1}
.vd small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.12em;color:rgba(245,241,230,.45);margin-bottom:3px}.vd b{font-size:14.5px;font-weight:700}

/* AI sheet */
.ai{position:fixed;z-index:6;inset:0;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);opacity:0;visibility:hidden;transform:scale(1.03);transition:opacity .35s,transform .45s var(--out),visibility .35s}
.ai.on{opacity:1;visibility:visible;transform:none}
.ai-in{max-width:720px;min-height:100%;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 20px 160px;display:flex;flex-direction:column;gap:12px}
@media(min-width:720px){.ai-in{padding-top:120px}}
.empty{margin:auto;text-align:center;padding:20px 0}.ai-in.has .empty{display:none}
.spark{width:64px;height:64px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--tint),var(--ai));box-shadow:0 14px 28px -10px var(--ai)}
.spark svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty h2{font:700 24px var(--gs);letter-spacing:-.02em}.empty p{color:var(--fg2);font-size:14px;margin:4px 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sg{border:1px solid var(--stroke);background:var(--card);color:var(--tint);padding:9px 14px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;transition:transform .4s var(--bounce)}.sg:active{transform:scale(.94)}
.m{max-width:85%;padding:11px 15px;border-radius:20px;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;animation:rise .4s var(--out)}
.m.u{align-self:flex-end;color:#fff;background:linear-gradient(135deg,var(--tint),var(--ai));border-bottom-right-radius:6px}
.m.a,.m.t{align-self:flex-start;background:var(--card);border:1px solid var(--stroke);border-bottom-left-radius:6px}.m.t{color:var(--fg2);animation:bl 1.2s ease-in-out infinite}

/* navigation: glass tab bar + AI field (bottom on phones, top-left on desktop) */
.scrim{position:fixed;z-index:8;left:0;right:0;bottom:0;height:150px;opacity:.9;pointer-events:none;background:linear-gradient(transparent,var(--bg) 85%);-webkit-mask:linear-gradient(transparent,#000 60%);mask:linear-gradient(transparent,#000 60%)}
.dock{position:fixed;z-index:10;left:0;right:0;bottom:var(--kb,0px);margin:0 auto;width:min(100%,400px);padding:0 21px calc(26px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none;transition:bottom .3s var(--out)}
.dock.keyboard{padding-bottom:10px}.dock>*{pointer-events:auto}
@media(min-width:720px){.dock{left:20px;top:24px;right:auto;bottom:auto;margin:0;width:460px;padding:0;justify-content:flex-start;align-items:flex-start}.scrim{display:none}}
.glass{position:absolute;inset:0;border-radius:999px;pointer-events:none;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(190%);backdrop-filter:blur(14px) saturate(190%);box-shadow:0 10px 30px var(--shadow),inset 0 1.5px 1px var(--rim1),inset 0 -1px 1px var(--rim2)}
.lite .glass{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(rgba(255,255,255,.28),transparent 50%)}
.tabbar{position:relative;height:64px;width:calc(100% - 76px);touch-action:none;user-select:none;-webkit-user-select:none;transition:width .6s var(--spring)}
.dock.min .tabbar{width:132px}.dock.find .tabbar{width:64px}
@media(min-width:720px){.tabbar{width:224px}.dock.min .tabbar{width:132px}.dock.find .tabbar{width:64px}}
.pill{--z:0;position:absolute;z-index:1;left:0;top:4px;height:56px;border-radius:28px;background:var(--pill);pointer-events:none;will-change:transform}
.clip{position:absolute;inset:0;border-radius:inherit;overflow:hidden}.pill.lens{z-index:3}
.pill::before,.pill::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:var(--z);pointer-events:none;will-change:opacity}
.pill::before{background:var(--lensbg);box-shadow:0 8px 24px rgba(0,0,0,.16)}
.pill::after{z-index:2;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),inset 0 3px 7px rgba(255,255,255,.65),inset 0 -4px 9px rgba(255,255,255,.3)}
.zoom{position:absolute;left:0;top:-4px;width:var(--tw);height:64px;opacity:var(--z);visibility:hidden;will-change:transform,opacity}.lens .zoom{visibility:visible}
.items{position:absolute;z-index:2;inset:0;display:flex;padding:4px}
.item{flex:1 1 0;min-width:0;overflow:hidden;white-space:nowrap;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 10px var(--ui);color:var(--fg2);transition:flex-grow .6s var(--spring),opacity .35s,color .25s}
.item.on,.item.hover{color:var(--tint)}
.dock.min .item:not(.on),.dock.find .item:not(.on){flex-grow:0;opacity:0;pointer-events:none}
.item svg{width:26px;height:26px;fill:currentColor;fill-opacity:0;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transform-origin:50% 70%;transition:fill-opacity .3s}
.item.on svg{fill-opacity:.22}
.label{max-height:14px;transition:max-height .4s,opacity .3s}.dock.find .label{max-height:0;opacity:0}
.search{position:relative;flex:none;width:64px;height:64px;border-radius:32px;color:var(--ai);cursor:pointer;transition:width .6s var(--spring),transform .45s cubic-bezier(.3,1.6,.5,1)}
.search:active{transform:scale(.92)}.dock.find .search{width:calc(100% - 76px);transform:none}
.search>svg{position:absolute;left:20px;top:20px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search input{position:absolute;left:54px;top:0;width:calc(100% - 118px);height:100%;border:0;outline:0;background:none;font:inherit;font-size:17px;color:var(--fg);opacity:0;pointer-events:none;transition:opacity .35s .1s}
.search input::placeholder{color:var(--sub)}.dock.find .search input{opacity:1;pointer-events:auto}
.send{position:absolute;right:12px;top:13px;width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--tint),var(--ai));box-shadow:0 6px 14px -4px var(--ai);opacity:0;pointer-events:none;transform:scale(.6);transition:opacity .3s,transform .45s var(--bounce)}
.dock.find .send{opacity:.4;pointer-events:auto;transform:none}.dock.find .send.on{opacity:1}.send:active{transform:scale(.9)!important}
.send svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}.aurora i{animation:none}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="wrap" id="wrap" style="visibility:hidden">
  <header class="top">
    <div>
      <div class="eyebrow"><span class="vip">VIP</span><span id="eb"></span></div>
      <h1 id="h1"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="user">
      <button class="gb out" id="out" type="button" aria-label="Log out"><div class="glass"></div><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></button>
      <div class="av" aria-hidden="true"><i class="ring"></i><b id="ini">--</b><u></u></div>
    </div>
  </header>

  <section class="panel on" id="p-home">
    <div class="home">
      <div class="stage"><div class="vc" id="vc">
        <div class="vt"><div class="vb"><svg viewBox="0 0 24 24"><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7Z"/><path d="M5 20h14"/></svg>VIP ACCESS</div><div class="chip"></div></div>
        <div><div class="vg">PREMIUM ACCESS GRANTED</div><div class="vn" id="vn">—</div></div>
        <div class="vd"><div><small>ARCOS ID</small><b id="vi">—</b></div><div><small>TYPE</small><b id="vy">Platinum</b></div><div class="full"><small>STATUS</small><b id="vs">Active</b></div></div>
      </div></div>
      <div><div class="sh"><h2>Quick access</h2><p>Jump straight into your tools</p></div><div class="tiles" id="qa"></div></div>
    </div>
  </section>
  <section class="panel" id="p-details"></section>
</main>

<div class="ai" id="ai"><div class="ai-in" id="aiin">
  <div class="empty"><div class="spark"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></div><h2>How can I help?</h2><p>Ask about attendance, reports or hubs.</p><div class="chips" id="sg"></div></div>
</div></div>

<div class="scrim"></div>
<div class="dock" id="dock">
  <div class="tabbar" id="tabbar"><div class="glass"></div><div class="pill" id="pill"><div class="clip"><div class="zoom" id="zoom" aria-hidden="true"><div class="items" id="zitems"></div></div></div></div><div class="items" id="items"></div></div>
  <div class="search" id="search" role="button" tabindex="0" aria-label="Ask AI"><div class="glass"></div>
    <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
    <input id="query" placeholder="Ask AI…" autocomplete="off" enterkeyhint="send" aria-label="Ask AI">
    <button class="send" id="send" type="button" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
</div>

<script>
(function(){"use strict";
var $=function(i){return document.getElementById(i)};
function ck(n){var m=document.cookie.match(new RegExp("(?:^|; )"+n+"=([^;]*)"));return m?decodeURIComponent(m[1]):null}
var uid=ck("id"),name=ck("name");
if(!uid||!name){location.href="/login";return}
if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(e){console.warn("Service worker registration failed:",e)})});

var AI_ENDPOINT="/ai"; /* POST {message,id,name} → JSON {reply} */
var root=document.documentElement,dk=matchMedia("(prefers-color-scheme:dark)");
function theme(){root.dataset.theme=dk.matches?"dark":"light"}theme();dk.addEventListener("change",theme);
if((navigator.deviceMemory||8)<=4||(navigator.hardwareConcurrency||8)<=4)root.classList.add("lite");

var P='fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"';
var IC={
home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
hubs:'<path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 9h1M9 13h1M14 9h1M14 13h1"/><path d="M10 21v-4h4v4"/>',
forms:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',

var vc=$("vc");

/* ---------- liquid-glass tab bar ---------- */
var TABS=[{k:"home",n:"Home",i:"home"},{k:"details",n:"Details",i:"hubs"}];
var clamp=function(v,a,b){return Math.min(b==null?1:b,Math.max(a==null?0:a,v))};
var haptic=function(){try{navigator.vibrate&&navigator.vibrate(7)}catch(e){}};
var calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
var fx=function(el,kf,o){return calm||el.animate(kf,o)};
var dock=$("dock"),tabbar=$("tabbar"),pill=$("pill"),zoom=$("zoom"),query=$("query"),sendBtn=$("send"),aiEl=$("ai"),aiin=$("aiin");
function mkItems(host,real){return TABS.map(function(t){var el=document.createElement(real?"button":"div");el.className="item";if(real){el.type="button";el.setAttribute("aria-label",t.n)}el.innerHTML=svg(t.i)+'<span class="label">'+t.n+"</span>";host.appendChild(el);return el})}
var items=mkItems($("items"),1),zoomItems=mkItems($("zitems"),0);
var bounce=function(i){return fx(items[i].firstChild,[{transform:"none"},{transform:"translateY(-6px) scale(.95,1.06)",offset:.28},{transform:"scale(1.07,.92)",offset:.58},{transform:"translateY(-1.5px) scale(.99,1.02)",offset:.78},{transform:"none"}],{duration:550,easing:"ease-out"})};

var current=0,pos={p:0,v:0},scl={p:1,v:0},press=null,drag=false,dragX=null,hov=-1,vel=0,lx=0,lt=0,compact=false,prev=0,until=0,run=false,lw=0,wasLens=false;
var spring=function(s,t,k,d,dt){s.v+=(-k*(s.p-t)-d*s.v)*dt;s.p+=s.v*dt};
function tick(now){
var dt=Math.min(.03,(now-prev)/1000);prev=now;
var it=items[current],w=it.offsetWidth,target=dragX!==null?dragX:it.offsetLeft;
var moving=drag||Math.abs(pos.v)>40||Math.abs(pos.p-target)>2;
spring(pos,target,340,27,dt);spring(scl,moving?1.25:1,420,27,dt);
var idle=!drag&&dragX===null&&Math.abs(pos.p-target)<.25&&Math.abs(pos.v)<6&&Math.abs(scl.p-1)<.002&&Math.abs(scl.v)<.05;
if(idle){pos.p=target;pos.v=0;scl.p=1;scl.v=0}
var z=clamp((scl.p-1)/.25),lens=z>.01,st=idle?0:Math.min(.3,Math.abs(pos.v)/2200);
if(w!==lw){pill.style.width=w+"px";lw=w}
pill.style.transform="translate3d("+pos.p+"px,0,0) scale("+scl.p*(1+st)+","+scl.p*(1-st*.5)+")";
if(lens||wasLens){pill.style.setProperty("--z",lens?z.toFixed(3):0);zoom.style.transform="translate3d("+(-pos.p)+"px,0,0)";pill.classList.toggle("lens",lens)}
wasLens=lens;
if(!idle||now<until)requestAnimationFrame(tick);else run=false}
function wake(ms){until=Math.max(until,performance.now()+(ms||0));if(!run){run=true;prev=performance.now();requestAnimationFrame(tick)}}
new ResizeObserver(function(){pill.style.setProperty("--tw",tabbar.offsetWidth+"px");wake(150)}).observe(tabbar);
function setDock(c,on){if(dock.classList.contains(c)===on)return;dock.classList.toggle(c,on);wake(750)}

function showPanel(k){document.querySelectorAll(".panel").forEach(function(p){p.classList.toggle("on",p.id==="p-"+k)});setHead(k);scrollTo({top:0});try{history.replaceState(null,"","#"+k)}catch(e){}}
function selectTab(i,quiet){current=i;items.forEach(function(el,k){el.classList.toggle("on",k===i);el.classList.remove("hover");zoomItems[k].classList.toggle("on",k===i);zoomItems[k].classList.remove("hover")});showPanel(TABS[i].k);if(!quiet){bounce(i);haptic()}wake()}
var hit=function(x){return clamp(Math.floor((x-tabbar.getBoundingClientRect().left-items[0].offsetLeft)/items[0].offsetWidth),0,items.length-1)};
var setHover=function(h){hov=h;items.forEach(function(el,k){el.classList.toggle("hover",k===h);zoomItems[k].classList.toggle("hover",k===h)})};
function dragPill(e){var r=tabbar.getBoundingClientRect(),w=items[0].offsetWidth,now=performance.now(),min=items[0].offsetLeft,max=items[items.length-1].offsetLeft;
vel=.7*vel+.3*((e.clientX-lx)/(now-lt+1));lx=e.clientX;lt=now;
var x=e.clientX-r.left-w/2;if(x<min)x=min+(x-min)*.3;if(x>max)x=max+(x-max)*.3;dragX=x;
var h=clamp(Math.round((x-min)/w),0,items.length-1);if(h!==hov){setHover(h);haptic()}}
tabbar.addEventListener("pointerdown",function(e){
if(dock.classList.contains("min")||dock.classList.contains("find")){compact=true;return}
tabbar.setPointerCapture(e.pointerId);var i=hit(e.clientX);press={x:e.clientX,i:i,re:i===current};vel=0;lx=e.clientX;lt=performance.now();
if(!press.re){selectTab(i);wake()}});
tabbar.addEventListener("pointermove",function(e){if(!press)return;if(!drag){if(Math.abs(e.clientX-press.x)<8)return;drag=true;hov=-1}dragPill(e);wake()});
tabbar.addEventListener("pointerup",function(){
if(compact){compact=false;closeAI();setDock("min",false);return}
if(!press)return;var p=press,was=drag,i=p.i;press=null;drag=false;
if(was){var w=items[0].offsetWidth,min=items[0].offsetLeft;i=clamp(Math.round((dragX+vel*160-min)/w),0,items.length-1);dragX=null;setHover(-1)}
if(i!==current)selectTab(i);else if(p.re){scrollTo({top:0,behavior:"smooth"});bounce(current);haptic()}
wake()});
tabbar.addEventListener("pointercancel",function(){compact=false;press=null;drag=false;dragX=null;setHover(-1);wake()});
items.forEach(function(el,k){el.addEventListener("click",function(e){if(e.detail===0&&k!==current)selectTab(k)})});

var busy=false;
function upd(){sendBtn.classList.toggle("on",!!query.value.trim())}
function add(cls,t){var d=document.createElement("div");d.className="m "+cls;d.textContent=t;aiin.appendChild(d);aiin.classList.add("has");aiEl.scrollTop=aiEl.scrollHeight;return d}
function send(t){t=(t||query.value).trim();if(!t||busy)return;query.value="";upd();add("u",t);busy=true;var w=add("t","Thinking…");
fetch(AI_ENDPOINT,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t,id:uid,name:name})})
.then(function(r){if(!r.ok)throw 0;return r.json()})
.then(function(d){w.className="m a";w.textContent=d.reply||d.answer||d.text||d.message||"No answer received."})
.catch(function(){w.className="m a";w.textContent="AI isn't connected yet. Set AI_ENDPOINT in this page's script to your AI route."})
.then(function(){busy=false;aiEl.scrollTop=aiEl.scrollHeight})}
