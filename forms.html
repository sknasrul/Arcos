<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forms</title>
<meta name="navigation-bar-color" content="#F2F2F7">
<meta name="theme-color" content="#F2F2F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F2F7;
    --card:rgba(255,255,255,.74);
    --card-stroke:rgba(255,255,255,.85);
    --fill:rgba(120,120,128,.10);
    --hair:rgba(60,60,67,.11);
    --ink:#1C1C1E;
    --ink-2:rgba(60,60,67,.72);
    --ink-3:rgba(60,60,67,.5);
    --blue:#007AFF;

    --shadow:0 1px 1px rgba(0,0,0,.03), 0 8px 24px -10px rgba(40,40,70,.16), 0 24px 48px -28px rgba(40,40,70,.18);
    --shadow-lift:0 2px 2px rgba(0,0,0,.04), 0 16px 36px -12px rgba(40,40,70,.24), 0 36px 64px -30px rgba(40,40,70,.26);

    --spring:cubic-bezier(.32,.72,0,1);
    --out:cubic-bezier(.22,1,.36,1);
    --bounce:cubic-bezier(.34,1.56,.64,1);

    --gs:'Google Sans','Google Sans Flex','Product Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;

    --nav-h:64px;
  }
  .t-leave{--c:#007AFF;--cb:rgba(0,122,255,.13);}
  .t-shift{--c:#FF9500;--cb:rgba(255,149,0,.15);}
  .t-resign{--c:#FF3B30;--cb:rgba(255,59,48,.12);}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;min-height:200vh;background:var(--bg);color:var(--ink);
    font-family:var(--ui);font-size:15px;line-height:1.4;overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  }
  a{color:inherit;text-decoration:none;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:2.5px solid var(--blue);outline-offset:3px;border-radius:10px;}

  .aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .aurora i{position:absolute;border-radius:50%;opacity:.55;will-change:transform;backface-visibility:hidden;}
  .aurora i:nth-child(1){width:660px;height:660px;left:-210px;top:-190px;background:radial-gradient(closest-side,#9CC8FF 30%,rgba(156,200,255,0));animation:drift1 26s ease-in-out infinite alternate;}
  .aurora i:nth-child(2){width:600px;height:600px;right:-190px;top:50px;background:radial-gradient(closest-side,#C9B8FF 30%,rgba(201,184,255,0));animation:drift2 32s ease-in-out infinite alternate;}
  .aurora i:nth-child(3){width:660px;height:660px;left:calc(28% - 70px);top:490px;background:radial-gradient(closest-side,#A6EBCB 30%,rgba(166,235,203,0));opacity:.4;animation:drift3 38s ease-in-out infinite alternate;}
  @keyframes drift1{to{transform:translate(90px,70px) scale(1.12);}}
  @keyframes drift2{to{transform:translate(-80px,90px) scale(1.08);}}
  @keyframes drift3{to{transform:translate(-110px,-60px) scale(1.15);}}

  .glass-btn{
    position:relative;isolation:isolate;flex-shrink:0;
    width:46px;height:46px;border-radius:50%;border:0;padding:0;
    display:grid;place-items:center;cursor:pointer;color:var(--ink);
    box-shadow:0 10px 26px -8px rgba(30,30,60,.28), 0 2px 6px rgba(30,30,60,.10);
    transition:transform .5s var(--bounce), box-shadow .4s var(--spring);
    --mx:30%;--my:18%;
  }
  .glass-btn::before{
    content:"";position:absolute;inset:0;border-radius:inherit;z-index:-2;
    background:linear-gradient(155deg,rgba(255,255,255,.38),rgba(255,255,255,.06) 55%,rgba(255,255,255,.2));
    -webkit-backdrop-filter:blur(10px) saturate(230%) brightness(1.08) contrast(1.02);
    backdrop-filter:blur(10px) saturate(230%) brightness(1.08) contrast(1.02);
  }
  .glass-btn::after{
    content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;
    background:radial-gradient(70px circle at var(--mx) var(--my),rgba(255,255,255,.7),rgba(255,255,255,0) 64%);
    box-shadow:
      inset 1.5px 1.5px 1px rgba(255,255,255,.95),
      inset -1.5px -1.5px 1px rgba(255,255,255,.8),
      inset 0 0 0 1px rgba(255,255,255,.22),
      inset 7px 7px 12px -9px rgba(110,170,255,.55),
      inset -7px -7px 12px -9px rgba(255,140,200,.45),
      inset 0 0 14px rgba(255,255,255,.28),
      0 0 0 .5px rgba(60,60,67,.12);
    transition:opacity .3s ease;
  }
  .glass-btn svg{width:22px;height:22px;transition:transform .5s var(--bounce);}
  @media (hover:hover){
    .glass-btn:hover{transform:scale(1.07);box-shadow:0 16px 34px -10px rgba(30,30,60,.34), 0 3px 8px rgba(30,30,60,.12);}
    .glass-btn.back:hover svg{transform:translateX(-2px);}
  }
  .glass-btn:active{transform:scale(.88);transition-duration:.18s;box-shadow:0 4px 12px -4px rgba(30,30,60,.3);}
  .glass-btn:active svg{transform:scale(.92);}

  .navbar{position:fixed;top:0;left:0;right:0;z-index:50;pointer-events:none;}
  .navbar::before{
    content:"";position:absolute;inset:0 0 -14px 0;opacity:0;transition:opacity .4s ease;
    background:linear-gradient(180deg,rgba(242,242,247,.92),rgba(242,242,247,.6) 60%,rgba(242,242,247,0));
    -webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
    -webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent);
  }
  body.scrolled .navbar::before{opacity:1;}
  .navbar-inner{
    position:relative;max-width:680px;margin:0 auto;height:calc(var(--nav-h) + env(safe-area-inset-top));
    padding:calc(env(safe-area-inset-top) + 9px) 14px 9px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .navbar .glass-btn{pointer-events:auto;}
  .nav-title{
    position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 9px);height:46px;transform:translate(-50%,8px);
    display:flex;align-items:center;font-family:var(--gs);font-weight:500;font-size:17px;letter-spacing:-.01em;
    opacity:0;transition:opacity .35s ease, transform .5s var(--spring);white-space:nowrap;
  }
  body.scrolled .nav-title{opacity:1;transform:translate(-50%,0);}

  .wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:calc(var(--nav-h) + env(safe-area-inset-top) + 6px) 14px 64px;}

  .large-title{margin:0 0 26px;padding:0 6px;transform-origin:left top;
    opacity:calc(1 - var(--p,0));transform:translateY(calc(var(--p,0) * -10px)) scale(calc(1 - var(--p,0) * .035));will-change:transform,opacity;}
  h1{font-family:var(--gs);font-weight:700;font-size:clamp(34px,8vw,52px);line-height:1.04;letter-spacing:-.03em;margin:0 0 10px;}
  .subtitle{margin:0;font-size:15.5px;color:var(--ink-2);}

  .card{
    position:relative;background:var(--card);border:1px solid var(--card-stroke);border-radius:28px;box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  }
  .card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 .5px rgba(60,60,67,.05);}

  .list{display:grid;gap:12px;}
  .form-item{
    display:flex;align-items:center;gap:18px;padding:18px 20px;cursor:pointer;user-select:none;
    transition:transform .5s var(--spring), box-shadow .5s var(--spring);
    animation:rise .9s var(--out) var(--d,0ms) backwards;
  }
  .form-item:nth-child(2){--d:70ms;}
  .form-item:nth-child(3){--d:140ms;}
  @keyframes rise{from{opacity:0;transform:translateY(26px) scale(.975);}to{opacity:1;transform:none;}}
  @media (hover:hover){
    .form-item:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);}
  }
  .form-item:active{transform:scale(.985);}
  .form-icon{
    width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex-shrink:0;
    background:var(--cb);color:var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
  }
  .form-icon svg{width:32px;height:32px;}
  .form-text{flex:1;min-width:0;}
  .form-name{font-family:var(--gs);font-weight:500;font-size:20px;letter-spacing:-.01em;margin:0;}
  .form-desc{font-size:13.5px;color:var(--ink-2);margin:3px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chev{width:18px;height:18px;flex-shrink:0;color:var(--ink-3);}

  @media (min-width:900px){
    .navbar-inner,.wrap{max-width:760px;}
    .form-item{padding:20px 22px;}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001s !important;animation-delay:0s !important;transition-duration:.001s !important;transition-delay:0s !important;}
    .aurora i{animation:none;}
  }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="navbar">
  <div class="navbar-inner">
    <button class="glass-btn back" id="backBtn" type="button" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
    </button>
    <div class="nav-title" aria-hidden="true">Forms</div>
    <button class="glass-btn" type="button" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <section class="large-title" id="largeTitle">
    <h1>Forms</h1>
    <p class="subtitle">Submit and track your requests</p>
  </section>

  <div class="list">
    <a class="card form-item t-leave" href="https://docs.google.com/forms/d/1ZOX3JUm4gt3heUbnLO03oqCUz17ULAwMzEfun83Adm8/viewform" target="_blank" rel="noopener">
      <div class="form-icon">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="4.5" y="7.5" width="23" height="20" rx="6.5" fill="currentColor" fill-opacity=".16"></rect><rect x="4.5" y="7.5" width="23" height="20" rx="6.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></rect><path d="M4.5 14h23" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M11 4.5v5M21 4.5v5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="16" cy="20.6" r="5" fill="currentColor" fill-opacity=".22"></circle><path d="M13.7 20.7l1.8 1.8 3.1-3.6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
      <div class="form-text">
        <p class="form-name">Leave</p>
        <p class="form-desc">Apply for planned or emergency leave</p>
      </div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5.5l6.5 6.5L9 18.5"/></svg>
    </a>

    <div class="card form-item t-shift">
      <div class="form-icon">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="11.5" fill="currentColor" fill-opacity=".16"></circle><path d="M25.6 11.9A10.4 10.4 0 0 0 6.6 12.6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path><path d="M25.9 6.4v5.8h-5.6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path><path d="M6.4 20.1a10.4 10.4 0 0 0 19-.7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path><path d="M6.1 25.6v-5.8h5.6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path><path d="M16 11.6V16l2.9 1.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
      <div class="form-text">
        <p class="form-name">Shift Change</p>
        <p class="form-desc">Request a change to your assigned shift</p>
      </div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5.5l6.5 6.5L9 18.5"/></svg>
    </div>

    <div class="card form-item t-resign">
      <div class="form-icon">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M17.5 6.5h-6A3 3 0 0 0 8.5 9.5v13a3 3 0 0 0 3 3h6" fill="currentColor" fill-opacity=".16"></path><path d="M17.5 6.5h-6A3 3 0 0 0 8.5 9.5v13a3 3 0 0 0 3 3h6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path><path d="M14 16h11" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path><path d="M21.4 12.4L25 16l-3.6 3.6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
      <div class="form-text">
        <p class="form-name">Resignation</p>
        <p class="form-desc">Submit your resignation request</p>
      </div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5.5l6.5 6.5L9 18.5"/></svg>
    </div>
  </div>
</main>

<script>
(function(){
  "use strict";
  var titleEl = document.getElementById('largeTitle');
  var ticking = false, lastP = '';

  function onScroll(){
    if(ticking) return; ticking = true;
    requestAnimationFrame(function(){
      var y = window.scrollY || 0;
      document.body.classList.toggle('scrolled', y > 56);
      var p = Math.min(1, Math.max(0, (y - 10) / 110)).toFixed(3);
      if(p !== lastP){ lastP = p; titleEl.style.setProperty('--p', p); }
      ticking = false;
    });
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  onScroll();

  document.querySelectorAll('.glass-btn').forEach(function(btn){
    btn.addEventListener('pointermove', function(e){
      var r = btn.getBoundingClientRect();
      btn.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
      btn.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
    });
    btn.addEventListener('pointerleave', function(){ btn.style.setProperty('--mx', '30%'); btn.style.setProperty('--my', '18%'); });
  });

  document.getElementById('backBtn').addEventListener('click', function(){ history.back(); });
})();
</script>
</body>
</html>
